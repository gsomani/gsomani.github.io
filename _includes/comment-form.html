<script>
var commentApi = "{{site.commentApi}}";
var threadId = {{page.issue}};

function createComment(data, thread) {
  const msg = {};
  for (const [key, value] of data.entries())
    msg[key] = value;

  fetch(`${commentApi}/api/comments/${thread}`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(msg)
  }).then(response => {
    if (!response.ok) throw new Error(response.status);
{% if page.title == 'Contact' %}
    alert('Message sent!');
{% else %}
    alert('Comment added successfully!');
    readComments(thread);
{% endif %}
  }).catch(error => {
    alert('Error adding comment');
  });
}
</script>


<form id="commentForm" action="" class="comment-form">
  <input id="honeypot" name="honeypot" type="text" /> 

<input
      class="comment-name"
      name="name"
      type="text"
      placeholder="Name"
      required
    />

{% if page.layout == 'journal' %}

{% elsif page.title == 'Contact' %}
   <input
      class="comment-name"
      name="email"
      type="email"
      placeholder="Email"
      required
    />
{% else %}

   <input
      class="comment-name"
      name="email"
      type="email"
      placeholder="Email(optional)"
    />

{% endif %}

  <textarea
    class="comment-message"
    name="message"
    id="comment-message"
    placeholder="Comment (markdown accepted)"
    required
  ></textarea>
    
  <button class="comment-submit" >
    SUBMIT
  </button>
</form>

<script>
  var simplemde = new SimpleMDE({
    element: document.getElementById("comment-message"),
    forceSync: true,
    spellChecker: false,
    status: false,
    placeholder: "Comment (markdown supported)",
  });


let commentForm = document.getElementById("commentForm");


commentForm.addEventListener("submit", (e) => {
  e.preventDefault();

        var form = e.target;
        var formData = new FormData(form);

        var honeypot = formData.get('honeypot');
        if (honeypot)
          return;

        formData.delete("honeypot"); 
        createComment(formData, threadId);
});

</script>
