<script src="https://cdn.jsdelivr.net/npm/showdown/dist/showdown.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script>
var commentApi = "{{site.commentApi}}";
var threadId = {{page.issue}};

function convertMarkdownToHtml(content) {
  const converter = new showdown.Converter();
  return DOMPurify.sanitize(converter.makeHtml(content));
}

function createCommentDiv(data) {
  const commentsDiv = document.getElementById("issue-comments");
  if (document.getElementById("comment-" + data.id))
    return;

  const commentDiv = document.createElement("div");
  commentDiv.classList.add("comment");
  commentDiv.setAttribute("id", "comment-" + data.id);

  const nameHeader = document.createElement("h3");
  nameHeader.textContent = data.name + " ";

  const dateElement = document.createElement("time");
  dateElement.classList.add("post-meta", "dt-published");
  const options = {month: 'long', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit'};
  dateElement.textContent = new Date(data.date).toLocaleDateString(undefined, options);

  const commentParagraph = document.createElement("div");
  commentParagraph.innerHTML = convertMarkdownToHtml(data.message);

  commentDiv.appendChild(nameHeader);
  commentDiv.appendChild(dateElement);
  commentDiv.appendChild(commentParagraph);
  commentsDiv.appendChild(commentDiv);
}

function readComments(thread) {
  fetch(`${commentApi}/api/comments/${thread}`)
    .then(response => response.json())
    .then(comments => comments.forEach(createCommentDiv))
    .catch(error => console.error('Error fetching comments:', error));
}

function showUpvotes(count) {
  const button = document.getElementById("upvote-button");
  button.innerText = count > 0 ? "👍" + count : "👍";
}

function readUpvotes(thread, update = false) {
  fetch(`${commentApi}/api/upvotes/${thread}`, {method: update ? "POST" : "GET"})
    .then(response => response.json())
    .then(data => showUpvotes(data.upvotes))
    .catch(error => console.error('Error fetching upvotes:', error));
}

window.addEventListener('DOMContentLoaded', function () {
  if (document.getElementById("issue-comments")) readComments(threadId);
  if (document.getElementById("upvote-button")) readUpvotes(threadId);
});
</script>
